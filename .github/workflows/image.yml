# Builds the bridge image on an x86 runner and pushes it to GHCR for Railway to deploy. MT5 is
# installed by running MetaQuotes' official installer in a plain container (Railway's sandbox, and
# possibly BuildKit's, trips its debugger check) and committing that container as the image.
name: mt5-bridge image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guardian-mt5-bridge" >> "$GITHUB_OUTPUT"

      - name: Build base (Wine, tools, bridge files)
        run: docker build --platform linux/amd64 -t bridge-base .

      - name: Install Python, MetaTrader5 and MT5 in a container
        run: docker run --name installer --entrypoint sh bridge-base /opt/bridge/install-mt5.sh

      - name: Keep the failure screenshot
        if: failure()
        run: docker cp installer:/tmp/install-failed.png install-failed.png || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: install-failed
          path: install-failed.png
          if-no-files-found: ignore

      - name: Commit the installed container as the image
        run: |
          docker commit \
            --change 'ENTRYPOINT ["/opt/bridge/entrypoint.sh"]' \
            --change 'CMD []' \
            installer "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker tag "${{ steps.image.outputs.name }}:${{ github.sha }}" "${{ steps.image.outputs.name }}:latest"

      - name: Smoke test
        run: |
          docker run -d --name bridge -e BRIDGE_TOKEN=ci -p 8000:8000 "${{ steps.image.outputs.name }}:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs bridge
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"
