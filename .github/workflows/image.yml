# Builds the bridge image (Wine, Windows Python, the MetaTrader5 package, the bridge) on an x86
# runner and pushes it to GHCR for Railway. MT5's program files are not in it (MetaQuotes' installer
# stops under Wine in containers; see install-python.sh): each bridge unpacks them from its volume.
name: mt5-bridge image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guardian-mt5-bridge" >> "$GITHUB_OUTPUT"

      - name: Build base (Wine, tools, bridge files)
        run: docker build --platform linux/amd64 -t bridge-base .

      - name: Install Python and the MetaTrader5 package in a container
        run: docker run --name installer --entrypoint sh bridge-base /opt/bridge/install-python.sh

      - name: Commit the installed container as the image
        run: |
          docker commit \
            --change 'ENTRYPOINT ["/opt/bridge/entrypoint.sh"]' \
            --change 'CMD []' \
            installer "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker tag "${{ steps.image.outputs.name }}:${{ github.sha }}" "${{ steps.image.outputs.name }}:latest"

      - name: Smoke test
        run: |
          # No MT5 archive in CI, so stand in a fake terminal file: /health must answer either way.
          docker run -d --name bridge -e BRIDGE_TOKEN=ci -p 8000:8000 \
            --entrypoint sh "${{ steps.image.outputs.name }}:${{ github.sha }}" -c \
            'mkdir -p "$WINEPREFIX/drive_c/Program Files/MetaTrader 5" && touch "$WINEPREFIX/drive_c/Program Files/MetaTrader 5/terminal64.exe" && exec /opt/bridge/entrypoint.sh'
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs bridge
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"
